# Badge "money conserved": the conservation fuzz (seeded matches, every tick, 0 Micro created or
# destroyed) and the exact base-unit conversion the contract's settle checks. Real runs, not an image.
name: money conserved
on:
  push:
    branches: [main]
  pull_request:
jobs:
  conservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/core/src/invariant.test.ts apps/server/src/settlement/toSettleArgs.test.ts
