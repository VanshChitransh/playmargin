<!doctype html>
<!-- One "How it works" clip: real footage (raw.mp4) under a paused GSAP timeline of Arcade Paper
     overlays. Every number on screen is read from the per-frame track the capture logged; the time
     map (real, slowed, sped up, frozen) is labelled on screen whenever it is not 1x. build.cjs fills
     DATA and SHOTS, then the motion-ad render.cjs seeks it frame by frame. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet">
<style>
:root { --paper:#FFF6E6; --ink:#1B1A2E; --safe:#2ED47A; --warn:#FFD43B; --liq:#E5484D; --gold:#F5B83D; --card:#fff; }
html,body { margin:0; width:640px; height:640px; overflow:hidden; background:var(--paper); }
#stage { position:relative; width:640px; height:640px; overflow:hidden; }
#cam { position:absolute; left:0; top:0; width:640px; height:640px; transform-origin:0 0; }
video { width:640px; height:640px; display:block; }
.sticker { position:absolute; background:var(--card); color:var(--ink); border:4px solid var(--ink); border-radius:16px; box-shadow:5px 5px 0 var(--ink); }
#cap { left:50%; top:22px; transform:translateX(-50%); padding:8px 18px; font:44px/1.05 'Lilita One'; text-align:center; white-space:nowrap; }
#cap.two { white-space:normal; width:560px; font-size:38px; }
#key { left:50%; bottom:22px; transform:translateX(-50%); padding:6px 16px; font:700 26px 'JetBrains Mono'; background:var(--warn); }
#key.down { transform:translateX(-50%) translate(4px,4px); box-shadow:1px 1px 0 var(--ink); }
#owe { padding:2px 10px; font:34px 'Lilita One'; background:var(--gold); white-space:nowrap; }
#rate { right:18px; top:96px; padding:2px 10px; font:700 22px 'JetBrains Mono'; background:var(--ink); color:var(--paper); }
#real { left:18px; bottom:22px; padding:2px 10px; font:700 18px 'JetBrains Mono'; background:var(--paper); }
#arrow { position:absolute; width:70px; height:70px; left:0; top:0; }
#fade { position:absolute; inset:0; background:var(--paper); opacity:0; }
</style></head><body>
<div id="stage">
  <div id="cam"><video id="v" src="raw.mp4" muted playsinline preload="auto"></video></div>
  <svg id="arrow" viewBox="0 0 70 70"><path d="M8 8 L56 30 L36 36 L30 56 Z" fill="#FFD43B" stroke="#1B1A2E" stroke-width="5" stroke-linejoin="round"/></svg>
  <div id="owe" class="sticker"></div>
  <div id="cap" class="sticker"></div>
  <div id="key" class="sticker"></div>
  <div id="rate" class="sticker"></div>
  <div id="real" class="sticker">REAL GAMEPLAY</div>
  <div id="fade"></div>
</div>
<script src="gsap.min.js"></script>
<script>
const DATA = /*DATA*/null
const SHOTS = /*SHOTS*/null
const FPS = DATA.fps, N = DATA.frames.length
const $ = (id) => document.getElementById(id)
const v = $('v')

// Time map: each shot plays footage [from, to] (frames) over dur seconds, or holds one frame.
let acc = 0
const segs = SHOTS.map((s) => { const seg = { ...s, t0: acc }; acc += s.dur; return seg })
window.DURATION = acc
const segAt = (t) => segs.find((s) => t < s.t0 + s.dur) || segs[segs.length - 1]
const footFrame = (t) => {
  const s = segAt(t)
  if (s.hold !== undefined) return s.hold
  const k = Math.min(1, Math.max(0, (t - s.t0) / s.dur))
  return Math.round(s.from + (s.to - s.from) * k)
}
const lerp = (a, b, k) => a + (b - a) * k
const frame = (i) => DATA.frames[Math.max(0, Math.min(N - 1, i))]
const who = (f, label) => (label === 'me' ? f.me : f.others.find((o) => o.label === label))

// Zoom and focus are tweened values so cuts read as camera moves.
const cam = { z: 1, fx: 0.5, fy: 0.5 }
const tl = gsap.timeline({ paused: true })
segs.forEach((s) => { if (s.z) tl.to(cam, { z: s.z, duration: s.zDur ?? 0.6, ease: 'power2.inOut' }, s.t0) })
tl.set({}, {}, acc)

function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px' }
function show(el, on) { el.style.display = on ? '' : 'none' }

window.seek = async (t) => {
  tl.seek(t, false)
  const s = segAt(t), fi = footFrame(t), f = frame(fi)
  // Focus: my blob (the camera already centres it) or the midpoint with another blob.
  const me = f.me, other = s.focus && s.focus !== 'me' ? who(f, s.focus) : null
  let fx = me && me.sx != null ? me.sx : 320, fy = me && me.sy != null ? me.sy : 320
  if (other && other.sx != null) { fx = (fx + other.sx) / 2; fy = (fy + other.sy) / 2 }
  const z = cam.z
  const tx = Math.min(0, Math.max(640 - 640 * z, 320 - fx * z)), ty = Math.min(0, Math.max(640 - 640 * z, 320 - fy * z))
  $('cam').style.transform = `translate(${tx}px,${ty}px) scale(${z})`
  const scr = (p) => ({ x: tx + p.sx * z, y: ty + p.sy * z, r: (p.sr || 0) * z })

  // Arrow points at its target from the upper left, outside the blob.
  const tgt = s.arrow && (s.arrow === 'spike' ? s.spikeAt && spikeScreen(f, s.spikeAt) : who(f, s.arrow))
  show($('arrow'), !!(tgt && tgt.sx != null))
  if (tgt && tgt.sx != null) { const p = scr(tgt), off = p.r * 0.72 + 8; place($('arrow'), p.x - off - 58, p.y - off - 58) }

  show($('owe'), !!(s.owe && me && me.state === 'alive'))
  if (s.owe && me && me.sx != null) { const p = scr(me); $('owe').textContent = 'owe ' + Math.round(me.owe); place($('owe'), Math.min(640 - 150, p.x + p.r + 12), p.y - 24) }

  const cap = typeof s.cap === 'function' ? s.cap(f) : s.cap
  show($('cap'), !!cap); if (cap) { $('cap').textContent = cap; $('cap').classList.toggle('two', cap.length > 22) }
  show($('key'), !!s.key); if (s.key) { $('key').textContent = s.key; $('key').classList.toggle('down', !!s.keyDown) }
  const rate = s.hold !== undefined ? 'PAUSED' : s.rate && s.rate !== 1 ? (s.rate < 1 ? 'SLOW ' : 'FAST ') + s.rate + 'x' : ''
  show($('rate'), !!rate); $('rate').textContent = rate
  $('fade').style.opacity = s.fadeIn ? Math.max(0, 1 - (t - s.t0) / 0.3) : s.fadeOut ? Math.min(1, (t - s.t0) / s.dur) : 0

  v.currentTime = (fi + 0.5) / FPS
  await new Promise((r) => v.addEventListener('seeked', r, { once: true }))
}
// Spike screen spot from world coordinates, using my blob as the anchor (sr / r = game zoom).
function spikeScreen(f, at) { const m = f.me, k = m.sr / m.r; return { sx: m.sx + (at.x - m.x) * k, sy: m.sy + (at.y - m.y) * k, sr: 30 * k } }

window.ready = (async () => {
  await document.fonts.ready
  if (v.readyState < 1) await new Promise((r) => v.addEventListener('loadedmetadata', r, { once: true }))
  await window.seek(0)
})()
</script></body></html>
