name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Real server + 2 SDK clients, one full free match at SIM_SPEED=4 (~30 s), no keys needed.
      - run: npm run e2e:local
      - run: npm run check:dashes
