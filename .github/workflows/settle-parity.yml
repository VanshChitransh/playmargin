# Badge "settle parity": settle(log) replays every hand-written and fuzzed match to exactly what the
# live world paid, and any edited log entry is caught at that seq. Real runs, not an image.
name: settle parity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/core/src/settle.test.ts
